<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#d4af37" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>
  <!-- Scales of Justice -->
  <g fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="110" x2="256" y2="400" />
    <line x1="170" y1="400" x2="342" y2="400" />
    <line x1="130" y1="170" x2="382" y2="170" />
    <!-- Left Scale -->
    <line x1="130" y1="170" x2="80" y2="280" stroke-width="12" />
    <line x1="130" y1="170" x2="180" y2="280" stroke-width="12" />
    <path d="M 60 280 Q 130 330 200 280 Z" fill="url(#gold)" opacity="0.8" />
    <!-- Right Scale -->
    <line x1="382" y1="170" x2="332" y2="280" stroke-width="12" />
    <line x1="382" y1="170" x2="432" y2="280" stroke-width="12" />
    <path d="M 312 280 Q 382 330 452 280 Z" fill="url(#gold)" opacity="0.8" />
  </g>
  <circle cx="256" cy="110" r="18" fill="url(#gold)" />
</svg>
